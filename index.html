<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- PWA Configurations -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EduGen PRO" />
    
    <!-- SEO Optimization -->
    <title>EduGen Panama PRO - Planificador AOA y MEDUCA</title>
    <meta name="description" content="Diseño curricular premium para docentes en Panamá bajo el Enfoque Orientado a la Acción (AOA). Generador de Lesson Planners, Proyectos Interdisciplinarios y Theme Planners." />
    
    <!-- Premium Google Fonts are loaded in src/index.css via @import -->
    
    <!-- Google AdSense & AMP Auto Ads Integration -->
    <script>
      (function() {
        const adClient = "%VITE_ADSENSE_CLIENT%";
        if (adClient && adClient !== "%" + "VITE_ADSENSE_CLIENT%" && adClient !== "ca-pub-XXXXXXXXXXXXXXX" && adClient.trim() !== "") {
          // 1. Standard Auto Ads
          const script = document.createElement('script');
          script.src = "https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=" + adClient;
          script.async = true;
          script.crossOrigin = "anonymous";
          document.head.appendChild(script);

          // 2. AMP Auto Ads
          const ampScript = document.createElement('script');
          ampScript.src = "https://cdn.ampproject.org/v0/amp-ad-0.1.js";
          ampScript.async = true;
          ampScript.setAttribute("custom-element", "amp-ad");
          document.head.appendChild(ampScript);

          // Append <amp-auto-ads> to body after load
          window.addEventListener('DOMContentLoaded', function() {
            const ampAutoAds = document.createElement('amp-auto-ads');
            ampAutoAds.setAttribute('type', 'adsense');
            ampAutoAds.setAttribute('data-ad-client', adClient);
            document.body.appendChild(ampAutoAds);
          });
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
